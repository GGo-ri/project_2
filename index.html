<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGV 자동 급수 모니터링 시스템</title>
    <link rel="stylesheet" href="style.css">

    <!-- 테마 초기화: 화면 그려지기 전에 미리 적용해서 깜빡임 방지 -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
    <script src="main.js" defer></script>
</head>
<body>

    <!-- ERROR 로그 발생 시 화면 전체가 번쩍이는 오버레이 -->
    <div class="screen-flash-overlay" id="screenFlashOverlay"></div>

    <!-- 다크모드 토글 버튼 -->
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="다크모드 전환" onclick="toggleTheme()">
        <svg class="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="dashboard-container">
        <main class="dashboard-grid">
            
            <!-- 실시간 그래프 -->
            <section class="card chart-card">
                <div class="chart-header">
                    <h2 class="main-title">AGV 자동 급수 모니터링</h2>
                    <div class="header-controls">
                        <div class="chart-legend">
                            <span class="legend-item"><span class="dot p1-dot"></span>화분 1</span>
                            <span class="legend-item"><span class="dot p2-dot"></span>화분 2</span>
                        </div>

                        <div class="date-select-wrapper">
                            <button type="button" class="date-picker-btn" id="datePickerBtn" onclick="toggleCalendar()">날짜 선택</button>
                            <div class="calendar-popup" id="calendarPopup" hidden>
                                <div class="calendar-header">
                                    <button type="button" class="calendar-nav" onclick="changeCalendarMonth(-1)">‹</button>
                                    <span class="calendar-month-label" id="calendarMonthLabel"></span>
                                    <button type="button" class="calendar-nav" onclick="changeCalendarMonth(1)">›</button>
                                </div>
                                <div class="calendar-weekdays">
                                    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                                </div>
                                <div class="calendar-days" id="calendarDays"></div>
                            </div>
                        </div>

                        <div class="interval-toggle disabled" id="intervalToggle" onclick="toggleHistoryInterval()" title="5분 단위 / 1시간 단위 전환 (날짜 선택 후 사용 가능)">
                            <span class="interval-label left">5분</span>
                            <span class="interval-switch">
                                <span class="interval-knob"></span>
                            </span>
                            <span class="interval-label right">1시간</span>
                        </div>

                        <span class="live-badge" id="liveBadge" onclick="setLiveMode(true)" title="실시간으로 전환">
                            <span class="live-dot"></span>LIVE
                        </span>

                        <span class="conn-badge" id="connBadge" hidden title="서버와의 연결이 원활하지 않습니다">
                            🔌 연결 끊김
                        </span>
                    </div>
                </div>

                <div class="current-range-label" id="currentRangeLabel"></div>

                <div class="chart-container">
                    <canvas id="soilMoistureChart"></canvas>
                </div>

                <div class="history-nav" id="historyNav" hidden>
                    <button type="button" class="history-nav-btn" id="historyPrevBtn" onclick="handlePrevClick()">‹ 이전 구간</button>
                    <button type="button" class="history-nav-btn" id="historyNextBtn" onclick="handleNextClick()">다음 구간 ›</button>
                </div>
            </section>

            <!-- 실시간 수치 및 AGV 상태 -->
            <section class="right-panel">
                <h3 class="panel-title">화분별 수분 현황</h3>

                <!-- 화분 1 -->
                <div class="stat-card plant1-card">
                    <div class="stat-info">
                        <span class="stat-label">화분 1 토양 수분</span>
                        <h2 class="stat-value" id="p1Val">--%</h2>
                        <span class="watering-status" id="wateringStatus1"></span>
                    </div>
                    <!-- 화분 1 수동 급수 버튼 -->
                    <button type="button" class="btn-water" id="waterBtn1" onclick="triggerManualWatering(1)">💧 수동 급수</button>
                </div>

                <!-- 화분 2 -->
                <div class="stat-card plant2-card">
                    <div class="stat-info">
                        <span class="stat-label">화분 2 토양 수분</span>
                        <h2 class="stat-value" id="p2Val">--%</h2>
                        <span class="watering-status" id="wateringStatus2"></span>
                    </div>
                    <!-- 화분 2 수동 급수 버튼 -->
                    <button type="button" class="btn-water" id="waterBtn2" onclick="triggerManualWatering(2)">💧 수동 급수</button>
                </div>

                <!-- AGV 상태 (한 줄짜리 카드 + 테스트 버튼) -->
                <div class="agv-status-card">
                    <span class="agv-label">AGV 상태</span>
                    <button type="button" class="agv-test-btn" onclick="runAgvTest()" title="상태 전환 테스트">테스트</button>
                    <span class="agv-status-badge" id="agvStatusBadge">
                        <span class="agv-dot agv-dot-idle" id="agvDot"></span>
                        <span id="agvStatusText">대기</span>
                    </span>
                </div>

                <!-- 급수 기록 (상시 표시, 로그처럼 스크롤) -->
                <div class="watering-log-card">
                    <div class="watering-log-title">급수 기록</div>
                    <div class="watering-log-list" id="wateringLogList">
                        <div class="log-empty">기록을 기다리는 중...</div>
                    </div>
                </div>

            </section>

        </main>

        <!-- 실시간 시스템 로그 -->
        <section class="card log-card">
            <div class="log-header">
                <h3 class="panel-title">실시간 시스템 로그</h3>
            </div>
            <div class="log-terminal" id="logTerminal">
                <div class="log-terminal-title">SYSTEM LOG</div>
                <div class="log-lines" id="logLines">
                    <div class="log-empty">로그를 기다리는 중...</div>
                </div>
            </div>
        </section>

    </div>

</body>
</html>
