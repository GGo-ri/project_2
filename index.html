<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGV 자동 급수 모니터링 시스템</title>
    <link rel="stylesheet" href="style.css">

    <!-- 테마 초기화: 화면이 그려지기 전에 미리 적용해서 깜빡임 방지 -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-streaming@2"></script>
    <script src="main.js" defer></script>
</head>
<body>

    <!-- 다크모드 토글 버튼 -->
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="다크모드 전환" onclick="toggleTheme()">
        <svg class="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="dashboard-container">
        <main class="dashboard-grid">
            
            <!-- 실시간 그래프 -->
            <section class="card chart-card">
                <div class="chart-header">
                    <h2 class="main-title">AGV 자동 급수 모니터링</h2>
                    <div class="chart-legend">
                        <span class="legend-item"><span class="dot p1-dot"></span>화분 1</span>
                        <span class="legend-item"><span class="dot p2-dot"></span>화분 2</span>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="soilMoistureChart"></canvas>
                </div>
            </section>

            <!-- 실시간 수치 및 AGV 상태 -->
            <section class="right-panel">
                <h3 class="panel-title">화분별 수분 현황</h3>

                <!-- 화분 1 -->
                <div class="stat-card plant1-card">
                    <div class="stat-info">
                        <span class="stat-label">화분 1 토양 수분</span>
                        <h2 class="stat-value" id="p1Val">--%</h2>
                    </div>
                    <!-- 화분 1 수동 급수 버튼 -->
                    <button type="button" class="btn-water" onclick="triggerManualWatering(1)">💧 수동 급수</button>
                </div>

                <!-- 화분 2 -->
                <div class="stat-card plant2-card">
                    <div class="stat-info">
                        <span class="stat-label">화분 2 토양 수분</span>
                        <h2 class="stat-value" id="p2Val">--%</h2>
                    </div>
                    <!-- 화분 2 수동 급수 버튼 -->
                    <button type="button" class="btn-water" onclick="triggerManualWatering(2)">💧 수동 급수</button>
                </div>

                <!-- AGV 상태 및 이벤트, 로그 확인 버튼 -->
                <div class="agv-box">
                    <div class="agv-status-row">
                        <span class="agv-label">AGV 상태</span>
                        <span class="agv-badge" id="agvBadge">[대기 상태]</span>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="test-btn" onclick="runFullScenario()">이벤트 테스트</button>
                        <button type="button" class="history-btn" onclick="openHistoryModal()">급수 기록</button>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <!-- 급수 기록 -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-content history-modal-content">
            <div class="modal-header">급수 기록</div>
            <div class="modal-body">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>급수 완료 시간</th>
                            <th>대상 화분</th>
                            <th>급수 결과</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
            <button type="button" class="close-btn" onclick="closeHistoryModal()">닫기</button>
        </div>
    </div>

    <!-- 이벤트 팝업 -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <div class="modal-body" id="modalMessage"></div>
        </div>
    </div>

</body>
</html>
