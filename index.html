<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGV 자동 급수 모니터링 시스템</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-streaming@2"></script>
    <script src="main.js" defer></script>
</head>
<body>

    <div class="dashboard-container">
        <main class="dashboard-grid">
            
            <!-- 실시간 그래프 -->
            <section class="card chart-card">
                <div class="chart-header">
                    <h2 class="main-title">AGV 자동 급수 모니터링</h2>
                    <div class="chart-legend">
                        <span class="legend-item"><span class="dot p1-dot"></span>화분 1</span>
                        <span class="legend-item"><span class="dot p2-dot"></span>화분 2</span>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="soilMoistureChart"></canvas>
                </div>
            </section>

            <!-- 실시간 수치 및 AGV 상태 -->
            <section class="right-panel">
                <h3 class="panel-title">화분별 습도 현황</h3>

                <!-- 화분 1 -->
                <div class="stat-card plant1-card">
                    <div class="stat-info">
                        <span class="stat-label">화분 1 토양 수분</span>
                        <h2 class="stat-value" id="p1Val">--%</h2>
                    </div>
                </div>

                <!-- 화분 2 -->
                <div class="stat-card plant2-card">
                    <div class="stat-info">
                        <span class="stat-label">화분 2 토양 수분</span>
                        <h2 class="stat-value" id="p2Val">--%</h2>
                    </div>
                </div>

                <!-- AGV 상태 및 이벤트, 로그 확인 버튼 -->
                <div class="agv-box">
                    <div class="agv-status-row">
                        <span class="agv-label">AGV 상태</span>
                        <span class="agv-badge" id="agvBadge">[대기 상태]</span>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="test-btn" onclick="runFullScenario()">이벤트 테스트</button>
                        <button type="button" class="history-btn" onclick="openHistoryModal()">급수 기록</button>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <!-- 급수 기록 -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-content history-modal-content">
            <div class="modal-header">급수 기록</div>
            <div class="modal-body">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>급수 완료 시간</th>
                            <th>대상 화분</th>
                            <th>급수 결과</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
            <button type="button" class="close-btn" onclick="closeHistoryModal()">닫기</button>
        </div>
    </div>

    <!-- 이벤트 팝업 -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">⚠️ 시스템 알림</div>
            <div class="modal-body" id="modalMessage"></div>
        </div>
    </div>

</body>
</html>
